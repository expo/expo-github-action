name: review

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-title:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: 🕵️ Validate PR title
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Keep the types in sync with the release rules in .releaserc.js
          pattern='^(feat|feature|fix|refactor|chore|docs)(\([^)]+\))?!?: .+'

          # Fetch the PR again so a re-run uses the current title
          pr=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json title,commits)
          title=$(jq -r .title <<< "$pr")
          if ! grep -Eq "$pattern" <<< "$title"; then
            echo "::error::PR title \"$title\" must use Conventional Commits, see CONTRIBUTING.md"
            exit 1
          fi

          # Squash merges of single-commit PRs use the commit message instead of the PR title
          if [ "$(jq '.commits | length' <<< "$pr")" -eq 1 ]; then
            message=$(jq -r '.commits[0].messageHeadline' <<< "$pr")
            if ! grep -Eq "$pattern" <<< "$message"; then
              echo "::error::The only commit \"$message\" must use Conventional Commits, see CONTRIBUTING.md"
              exit 1
            fi
          fi

  build:
    runs-on: ubuntu-latest
    steps:
      - name: 🏗 Setup repo
        uses: actions/checkout@v4

      - name: 🏗 Setup runner
        uses: ./.github/actions/setup

      - name: 📦 Install dependencies
        run: bun install

      - name: ✅ Lint code
        run: bun run lint --max-warnings=0

      - name: 🧪 Test code
        run: bun run test

      - name: 👷 Build code
        run: bun run clean && bun run build

      - name: 🕵️ Validate build
        id: diff
        run: |
          if [ "$(git diff --ignore-space-at-eol build/ | wc -l)" -gt "0" ]; then
            echo "⚠️ Build is outdated"
            echo "    > run 'bun run clean', 'bun run build', and commit changes"
            git diff
            exit 1
          fi

      - name: 🗂 Upload build
        uses: actions/upload-artifact@v4
        if: ${{ failure() && steps.diff.conclusion == 'failure' }}
        with:
          name: build
          path: build/
