name: review

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-title:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: 🕵️ Validate PR title
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          # Keep in sync with the release rules in .releaserc.js
          types: |
            feat
            feature
            fix
            refactor
            chore
            docs
          requireScope: false
          # Squash merges of single-commit PRs use the commit message instead of the PR title
          validateSingleCommit: true

  build:
    runs-on: ubuntu-latest
    steps:
      - name: 🏗 Setup repo
        uses: actions/checkout@v4

      - name: 🏗 Setup runner
        uses: ./.github/actions/setup

      - name: 📦 Install dependencies
        run: bun install

      - name: ✅ Lint code
        run: bun run lint --max-warnings=0

      - name: 🧪 Test code
        run: bun run test

      - name: 👷 Build code
        run: bun run clean && bun run build

      - name: 🕵️ Validate build
        id: diff
        run: |
          if [ "$(git diff --ignore-space-at-eol build/ | wc -l)" -gt "0" ]; then
            echo "⚠️ Build is outdated"
            echo "    > run 'bun run clean', 'bun run build', and commit changes"
            git diff
            exit 1
          fi

      - name: 🗂 Upload build
        uses: actions/upload-artifact@v4
        if: ${{ failure() && steps.diff.conclusion == 'failure' }}
        with:
          name: build
          path: build/
