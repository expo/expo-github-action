name: release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release:
        description: 'type "release" to open a release PR (main branch only)'
        required: false

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  dryrun:
    if: ${{ github.ref != 'refs/heads/main' || github.event.inputs.release != 'release' }}
    runs-on: ubuntu-latest
    permissions:
      # semantic-release checks push access even in dry-run mode
      contents: write
    steps:
      - name: 🏗 Setup repo
        uses: actions/checkout@v4

      - name: 🏗 Setup runner
        uses: ./.github/actions/setup

      - name: 📦 Install dependencies
        run: bun install --frozen-lockfile

      - name: 📋 Dry-running release
        run: bun semantic-release --dry-run
        env:
          GITHUB_TOKEN: ${{ github.token }}

  release-pr:
    if: ${{ github.ref == 'refs/heads/main' && github.event.inputs.release == 'release' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 🏗 Setup repo
        uses: actions/checkout@v4
        with:
          # Keep the token out of .git/config while installing packages
          persist-credentials: false

      - name: 🏗 Setup runner
        uses: ./.github/actions/setup

      - name: 📦 Install dependencies
        run: bun install --frozen-lockfile

      - name: 📋 Resolve next release
        run: bun semantic-release --dry-run
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_OUTPUT_DIR: ${{ runner.temp }}/release

      - name: 📝 Push release branch
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_DIR: ${{ runner.temp }}/release
        run: |
          if [ ! -f "$RELEASE_DIR/version" ]; then
            echo "No changes to release"
            exit 0
          fi

          version=$(cat "$RELEASE_DIR/version")
          branch="release/$version"
          title="chore: create new release $version"

          npm pkg set version="$version"
          { cat "$RELEASE_DIR/notes.md"; echo; cat CHANGELOG.md; } > CHANGELOG.md.tmp
          mv CHANGELOG.md.tmp CHANGELOG.md

          git config user.name "Expo CI"
          git config user.email "support+ci@expo.dev"
          git switch --create "$branch"
          git commit --message "$title" -- package.json CHANGELOG.md
          # Lets git read GH_TOKEN through gh, so the token stays out of the command line
          gh auth setup-git
          git push --force origin "$branch"

          # A person opens the PR, so Actions doesn't need permission to create or approve PRs, and CI runs on it
          url="https://github.com/${GITHUB_REPOSITORY}/compare/main...${branch}?expand=1&title=$(jq -rn --arg t "$title" '$t|@uri')"
          echo "::notice::Open the release PR: $url"
          {
            echo "## Release $version"
            echo
            echo "[Open the release PR]($url)"
            echo
            cat "$RELEASE_DIR/notes.md"
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    # Runs when a release PR from `release-pr` is merged
    if: "${{ github.event_name == 'push' && startsWith(github.event.head_commit.message, 'chore: create new release ') }}"
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: 🏗 Setup repo
        uses: actions/checkout@v4

      - name: 🕵️ Validate release PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          fail() {
            echo "::error::$1. Revert this commit and run the release workflow again."
            exit 1
          }

          # GitHub may take a moment to link a new commit to its PR
          for attempt in 1 2 3 4 5; do
            pr=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '[.[] | select(.base.ref == "main" and .merged_at != null)][0]')
            [ -n "$pr" ] && [ "$pr" != "null" ] && break
            sleep 10
          done
          if [ -z "$pr" ] || [ "$pr" = "null" ]; then
            echo "::error::No merged PR found for this commit yet. Re-run this job."
            exit 1
          fi
          [ "$(jq -r .head.ref <<< "$pr")" = "release/$version" ] || fail "The PR is not from release/$version"

          commits=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$(jq -r .number <<< "$pr")/commits")
          [ "$(jq length <<< "$commits")" -eq 1 ] || fail "The release PR must have exactly one commit"

          # Other merges since the release branch was created would ship without changelog entries
          release_base=$(jq -r '.[0].parents[0].sha' <<< "$commits")
          merge_parent=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA" --jq '.parents[0].sha')
          [ "$release_base" = "$merge_parent" ] || fail "main changed after the release branch was created"

      - name: 📋 Create release
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          version=$(node -p "require('./package.json').version")
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version \"$version\" in package.json"
            exit 1
          fi
          # Squash merges add " (#123)" to the title
          subject="${COMMIT_MESSAGE%%$'\n'*}"
          if [[ "$subject" != "chore: create new release $version" && "$subject" != "chore: create new release $version (#"* ]]; then
            echo "::error::Commit message does not match version $version in package.json"
            exit 1
          fi

          # The newest section of CHANGELOG.md holds the notes for this release
          awk '/^## \[/ { n++ } n == 1' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          # Skip when a re-run finds the release already made, so the major tag can still move
          if ! gh release view "$version" > /dev/null 2>&1; then
            gh release create "$version" --target "$GITHUB_SHA" --title "$version" --notes-file "$RUNNER_TEMP/notes.md"
          fi

          major="v${version%%.*}"
          git tag --force "$major" "$GITHUB_SHA"
          git push --force origin "$major"
