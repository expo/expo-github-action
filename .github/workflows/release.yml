name: release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release:
        description: 'type "release" to create the release (main branch only)'
        required: false

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  dryrun:
    if: ${{ github.ref != 'refs/heads/main' || github.event.inputs.release != 'release' }}
    runs-on: ubuntu-latest
    steps:
      - name: 🏗 Setup repo
        uses: actions/checkout@v4

      - name: 🏗 Setup runner
        uses: ./.github/actions/setup

      - name: 📦 Install dependencies
        run: bun install

      - name: 📋 Dry-running release
        run: bun semantic-release --dry-run
        env:
          GITHUB_TOKEN: ${{ github.token }}

  publish:
    if: ${{ github.ref == 'refs/heads/main' && github.event.inputs.release == 'release' }}
    runs-on: ubuntu-latest
    # semantic-release pushes the release commit and tag, and labels and comments on released issues and PRs
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: 🏗 Setup repo
        uses: actions/checkout@v4
        with:
          # Keep the token out of .git/config, semantic-release adds it to the push URL itself
          persist-credentials: false

      - name: 🏗 Setup runner
        uses: ./.github/actions/setup

      - name: 📦 Install dependencies
        run: bun install

      - name: 📋 Release code
        run: bun semantic-release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GIT_AUTHOR_NAME: Expo CI
          GIT_AUTHOR_EMAIL: support+ci@expo.dev
          GIT_COMMITTER_NAME: Expo CI
          GIT_COMMITTER_EMAIL: support+ci@expo.dev

  tags:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 🏗 Setup repo
        uses: actions/checkout@v4

      - name: 👷 Force repo to latest
        run: git fetch --all && git pull

      - name: 🕵️ Resolve major version
        id: version
        run: echo "major=$(node -p "require('./package.json').version.split('.')[0]")" >> "$GITHUB_OUTPUT"

      - name: 👷 Configure git
        run: |
          git config user.name "Expo CI"
          git config user.email "support+ci@expo.dev"

      - name: 🧹 Clean repo
        run: git clean . -xdf && git reset --hard HEAD && git pull && git fetch --tags

      - name: 📋 Update tags
        run: git tag --force "v$MAJOR" && git push --force origin "v$MAJOR"
        env:
          MAJOR: ${{ steps.version.outputs.major }}
