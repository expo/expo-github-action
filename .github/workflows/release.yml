name: release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release:
        description: 'type "release" to open a release PR (main branch only)'
        required: false

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  dryrun:
    if: ${{ github.ref != 'refs/heads/main' || github.event.inputs.release != 'release' }}
    runs-on: ubuntu-latest
    steps:
      - name: 🏗 Setup repo
        uses: actions/checkout@v4

      - name: 🏗 Setup runner
        uses: ./.github/actions/setup

      - name: 📦 Install dependencies
        run: bun install

      - name: 📋 Dry-running release
        run: bun semantic-release --dry-run
        env:
          GITHUB_TOKEN: ${{ github.token }}

  release-pr:
    if: ${{ github.ref == 'refs/heads/main' && github.event.inputs.release == 'release' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: 🏗 Setup repo
        uses: actions/checkout@v4
        with:
          # Keep the token out of .git/config while installing packages
          persist-credentials: false

      - name: 🏗 Setup runner
        uses: ./.github/actions/setup

      - name: 📦 Install dependencies
        run: bun install

      - name: 📋 Resolve next release
        run: bun semantic-release --dry-run
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_OUTPUT_DIR: ${{ runner.temp }}/release

      - name: 📝 Open release PR
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_DIR: ${{ runner.temp }}/release
        run: |
          if [ ! -f "$RELEASE_DIR/version" ]; then
            echo "No changes to release"
            exit 0
          fi

          version=$(cat "$RELEASE_DIR/version")
          branch="release/$version"
          title="chore: create new release $version"

          npm pkg set version="$version"
          { cat "$RELEASE_DIR/notes.md"; echo; cat CHANGELOG.md; } > CHANGELOG.md.tmp
          mv CHANGELOG.md.tmp CHANGELOG.md

          git config user.name "Expo CI"
          git config user.email "support+ci@expo.dev"
          git switch --create "$branch"
          git commit --message "$title" -- package.json CHANGELOG.md
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$branch"

          if gh pr view "$branch" --json state --jq .state | grep -q OPEN; then
            gh pr edit "$branch" --body-file "$RELEASE_DIR/notes.md"
          else
            gh pr create --base main --head "$branch" --title "$title" --body-file "$RELEASE_DIR/notes.md"
          fi

  publish:
    # Runs when a release PR from `release-pr` is merged
    if: "${{ github.event_name == 'push' && startsWith(github.event.head_commit.message, 'chore: create new release ') }}"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 🏗 Setup repo
        uses: actions/checkout@v4

      - name: 📋 Create release
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          version=$(node -p "require('./package.json').version")
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version \"$version\" in package.json"
            exit 1
          fi
          # Squash merges add " (#123)" to the title
          subject="${COMMIT_MESSAGE%%$'\n'*}"
          if [[ "$subject" != "chore: create new release $version" && "$subject" != "chore: create new release $version (#"* ]]; then
            echo "::error::Commit message does not match version $version in package.json"
            exit 1
          fi

          # The newest section of CHANGELOG.md holds the notes for this release
          awk '/^## \[/ { n++ } n == 1' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          gh release create "$version" --target "$GITHUB_SHA" --title "$version" --notes-file "$RUNNER_TEMP/notes.md"

          major="v${version%%.*}"
          git tag --force "$major" "$GITHUB_SHA"
          git push --force origin "$major"
