name: pr-title

on:
  # Only reads the PR title, so it is safe to run for forks with `pull_request_target`
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  pull-requests: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: 🕵️ Validate PR title
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          # Keep in sync with the release rules in .releaserc.js
          types: |
            feat
            feature
            fix
            refactor
            chore
            docs
          requireScope: false
          # Squash merges of single-commit PRs use the commit message instead of the PR title
          validateSingleCommit: true
